# 修正版 GitHub Actions 工作流：Android Kernel Driver Builder
# 目标：解决"Actions 显示运行成功、但 artifacts/ 为空、下载不到 .ko"的问题。
# 修复要点见各步 [FIX] 注释。

name: Android Kernel Driver Builder

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android 版本（例如 14）"
        required: true
      kernel_version:
        description: "内核版本（例如 6.1）"
        required: true
      driver_name:
        description: "驱动模块名，不带 .ko 后缀（例如 mydriver）"
        required: true
      target_arch:
        description: "目标架构（aarch64、x86_64 等）"
        required: true
        default: "aarch64"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "=== 清理前 ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker rmi $(docker image ls -aq) 2>/dev/null || true
          echo "=== 清理后 ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Prepare kernel driver directory
        # [FIX] 原脚本用 mv 把源文件移走，一旦后续失败就找不回 code/。改为 cp 并列出结果。
        run: |
          mkdir -p kerneldriver
          cp -v ./code/*.h ./code/*.c ./code/Makefile kerneldriver/
          ls -l kerneldriver/

      - name: Install repo tool
        run: |
          sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Setup Android kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync
          find . -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf .repo
          echo "=== repo sync 清理后 ==="
          df -h

      - name: Copy kernel driver
        run: |
          cd android-kernel
          cp -R ../kerneldriver common/drivers

      - name: Modify Makefile
        run: |
          cd android-kernel
          echo "obj-m += kerneldriver/" >> common/drivers/Makefile

      - name: Add module to GKI module list
        if: ${{ github.event.inputs.android_version > 13 }}
        run: |
          cd android-kernel
          MODULE_NAME="drivers/kerneldriver/${{ github.event.inputs.driver_name }}.ko"
          awk -i inplace -v module="$MODULE_NAME" '
            BEGIN { added=0 }
            /_COMMON_GKI_MODULES_LIST = \[/ { in_list=1 }
            in_list && /\]/ { if (!added) { print "\t\t\"" module "\","; added=1 } in_list=0 }
            in_list && !added { if (module < $0) { print "\t\t\"" module "\","; added=1 } }
            { print }
          ' common/modules.bzl

      - name: Prepare module list for legacy build
        if: ${{ github.event.inputs.android_version <= 13 }}
        run: |
          cd android-kernel
          echo "drivers/kerneldriver/${{ github.event.inputs.driver_name }}.ko" \
            >> common/Android/gki_${{ github.event.inputs.target_arch }}_modules

      - name: Increase frame size limit
        # [FIX] 原脚本拼写 -Wframe-bigr-than 是错的，应为 -Wframe-larger-than
        run: |
          cd android-kernel
          find . -type f -name "Makefile*" -exec sed -i 's/-Wframe-larger-than=[0-9]*/-Wframe-larger-than=4096/g' {} +
          grep -q "FRAME_WARN" common/Makefile || echo 'KBUILD_CFLAGS += -Wframe-larger-than=4096' >> common/Makefile

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python-is-python3

      - name: Fix Android 13 missing kprobe symbols
        if: ${{ github.event.inputs.android_version == 13 }}
        run: |
          cd android-kernel
          for symbol in register_kprobe unregister_kprobe; do
            grep -q "$symbol" common/Android/abi_gki_${{ github.event.inputs.target_arch }} || \
              echo "$symbol" >> common/Android/abi_gki_${{ github.event.inputs.target_arch }}
          done
          sed -i '/EXPORT_SYMBOL(unregister_kprobe);/a EXPORT_SYMBOL(register_kprobe);' common/kernel/kprobes.c

      - name: Build kernel
        # [FIX] 去掉 continue-on-error:true —— 这是"失败却显示成功、artifacts 为空"的头号元凶。
        run: |
          cd android-kernel
          if [ ${{ github.event.inputs.android_version }} -le 13 ]; then
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} LTO=thin build/build.sh -j32
            OUTPUT_PATH="out/android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}/dist"
          else
            echo "Using Bazel build system for Android ${{ github.event.inputs.android_version }}"
            tools/bazel run //common:kernel_${{ github.event.inputs.target_arch }}_dist
            OUTPUT_PATH="out/kernel_${{ github.event.inputs.target_arch }}"
          fi
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_ENV

      - name: Manually build external module (Bazel path)
        if: ${{ github.event.inputs.android_version > 13 }}
        run: |
          cd android-kernel
          KERNEL_BUILD_DIR=$(find out/ -name "vmlinux" -exec dirname {} \; 2>/dev/null | head -1 || true)
          if [ -z "$KERNEL_BUILD_DIR" ]; then
            KERNEL_BUILD_DIR=$(find out/ -path "*/common" -type d 2>/dev/null | head -1 || true)
          fi
          if [ -z "$KERNEL_BUILD_DIR" ]; then
            KERNEL_BUILD_DIR=$(find out/ -name "Module.symvers" -exec dirname {} \; 2>/dev/null | head -1 || true)
          fi
          echo "找到内核构建目录: $KERNEL_BUILD_DIR"
          if [ -n "$KERNEL_BUILD_DIR" ]; then
            # [FIX] M= 用绝对路径；原脚本 M=../common/... 在 cd android-kernel 后会越界到仓库外
            make -C "$KERNEL_BUILD_DIR" M="$(pwd)/common/drivers/kerneldriver" \
              ARCH=${{ github.event.inputs.target_arch }} \
              CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 modules
            find common/drivers/kerneldriver/ -name "*.ko" -exec cp -v {} ../kerneldriver/ \;
          else
            echo "警告：找不到内核构建目录，无法手动构建外部模块"
          fi
          # [FIX] 强制校验：必须出现目标 .ko，否则直接失败，不再静默通过
          if [ ! -f "../kerneldriver/${{ github.event.inputs.driver_name }}.ko" ]; then
            echo "!! 未生成 ${{ github.event.inputs.driver_name }}.ko，构建失败"; exit 1;
          fi

      - name: Collect build artifacts
        # [FIX] 改为全局 find *.ko 兜底，不依赖 OUTPUT_PATH 精确目录；driver_name 统一补 .ko
        run: |
          mkdir -p artifacts
          KO="${{ github.event.inputs.driver_name }}.ko"
          if [ -f "kerneldriver/$KO" ]; then
            cp -v "kerneldriver/$KO" artifacts/
          fi
          find android-kernel/common/drivers/kerneldriver/ -name "*.ko" -exec cp -v {} artifacts/ \; 2>/dev/null || true
          find android-kernel -name "$KO" -exec cp -v {} artifacts/ \; 2>/dev/null || true
          echo "=== artifacts 目录内容 ==="
          ls -l artifacts/

      - name: Guard empty artifacts
        # [FIX] artifacts 仍为空则明确报错，杜绝"成功但下载不到"的假象
        run: |
          if [ -z "$(ls -A artifacts)" ]; then
            echo "!! artifacts 为空，没有任何可上传产物"; exit 1;
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: artifacts/
